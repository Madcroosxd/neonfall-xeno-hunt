<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
  <title>NEONFALL: XENO HUNT</title>
  <style>
    *{box-sizing:border-box}html,body,#canvas{margin:0;padding:0;border:0;width:100%;height:100%}body{overflow:hidden;touch-action:none;color:#eafcff;background:#03050d;font-family:Inter,system-ui,sans-serif}#canvas{display:block}#canvas:focus{outline:0}#status{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#182451 0,#080d20 42%,#02030a 78%);visibility:hidden;overflow:hidden}#status:before,#status:after{content:"";position:absolute;inset:-30%;background-image:radial-gradient(#c9faff 1px,transparent 1px);background-size:58px 58px;opacity:.2;animation:drift 38s linear infinite}#status:after{background-size:97px 97px;opacity:.1;animation-duration:65s}.loader{position:relative;width:140px;height:140px}.core{position:absolute;inset:47px;border:1px solid #66f6ff;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c5ffff,#367bb8 42%,#11194b 75%);box-shadow:0 0 36px #66f6ff66}.orbit{position:absolute;inset:15px;border:1px solid #66f6ff44;border-radius:50%;animation:spin 2.8s linear infinite}.orbit.alt{inset:0;border-color:#ad75ff44;animation-duration:4.1s;animation-direction:reverse}.orbit i{position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:#66f6ff;box-shadow:0 0 14px #66f6ff}.orbit.alt i{background:#ad75ff;box-shadow:0 0 14px #ad75ff}.content{position:relative;z-index:2;text-align:center}.eyebrow{margin:28px 0 11px;color:#66f6ff;font:700 10px ui-monospace,monospace;letter-spacing:.24em}.title{margin:0;font-size:clamp(45px,8vw,86px);letter-spacing:.23em;text-indent:.23em;text-shadow:0 0 42px #66f6ff33}.copy{margin:13px 0 27px;color:#8191b2;font-size:13px}.track{width:min(500px,calc(100vw - 64px));height:4px;border:0;border-radius:5px;background:#7f9ac422;overflow:hidden}.track::-webkit-progress-bar{background:#7f9ac422}.track::-webkit-progress-value{background:linear-gradient(90deg,#9b64ff,#66f6ff);box-shadow:0 0 14px #66f6ff}.track::-moz-progress-bar{background:linear-gradient(90deg,#9b64ff,#66f6ff)}#status-notice{display:none;max-width:560px;margin-top:20px;padding:14px 18px;border:1px solid #ff668866;border-radius:8px;background:#3a0c1ccc;color:#ffb1c0;font-size:13px;line-height:1.5}#status-splash{display:none}@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{to{transform:translate3d(58px,58px,0)}}
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
  <canvas id="canvas">Tarayıcınız canvas özelliğini desteklemiyor.</canvas>
  <noscript>Oyunu çalıştırmak için JavaScript gereklidir.</noscript>
  <div id="status">
    <img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
    <div class="content">
      <div class="loader"><span class="core"></span><span class="orbit"><i></i></span><span class="orbit alt"><i></i></span></div>
      <p class="eyebrow">MADCROOS // SEKTÖR 07</p>
      <h1 class="title">NEONFALL</h1>
      <p class="copy">Godot savaş çekirdeği ve uzaylı telemetrisi yükleniyor.</p>
      <progress id="status-progress" class="track"></progress>
      <div id="status-notice"></div>
    </div>
  </div>
  <script src="index.js"></script>
  <script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9267584,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
let neonfallSession = null;

window.addEventListener('message', (event) => {
  if (event.origin !== window.location.origin || event.source !== window.parent || event.data?.type !== 'neonfall-session') return;
  neonfallSession = { runId: event.data.runId, runSecret: event.data.runSecret, username: event.data.username };
});

async function sendRunProgress(endpoint, score, wave, kills, elapsed) {
  if (!neonfallSession) return false;
  try {
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...neonfallSession, score, wave, kills, elapsed }),
      keepalive: endpoint.endsWith('/finish'),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Score rejected');
    if (endpoint.endsWith('/finish')) window.parent.postMessage({ type: 'neonfall-score-verified', ...data }, window.location.origin);
    return true;
  } catch (error) {
    if (endpoint.endsWith('/finish')) window.parent.postMessage({ type: 'neonfall-score-rejected' }, window.location.origin);
    console.warn('NEONFALL score sync:', error);
    return false;
  }
}

window.NeonfallBridge = {
  heartbeat: (score, wave, kills, elapsed) => sendRunProgress('/api/run/heartbeat', score, wave, kills, elapsed),
  finish: (score, wave, kills, elapsed) => sendRunProgress('/api/run/finish', score, wave, kills, elapsed),
  getUsername: () => neonfallSession?.username || 'PILOT',
  restart: () => window.parent.postMessage({ type: 'neonfall-restart' }, window.location.origin),
};

(function () {
  const overlay = document.getElementById('status');
  const progress = document.getElementById('status-progress');
  const notice = document.getElementById('status-notice');
  let initializing = true;
  function fail(error) {
    console.error(error);
    notice.textContent = error instanceof Error ? error.message : String(error);
    notice.style.display = 'block';
    progress.style.display = 'none';
    overlay.style.visibility = 'visible';
    initializing = false;
  }
  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length) {
    fail('Bu tarayıcı Godot Web için gerekli özellikleri desteklemiyor: ' + missing.join(', '));
    return;
  }
  overlay.style.visibility = 'visible';
  engine.startGame({ onProgress(current, total) {
    if (current > 0 && total > 0) {
      progress.value = current;
      progress.max = total;
      window.parent.postMessage({ type: 'neonfall-progress', progress: Math.round(current / total * 100) }, window.location.origin);
    } else {
      progress.removeAttribute('value');
      progress.removeAttribute('max');
    }
  }}).then(() => {
    if (!initializing) return;
    overlay.remove();
    initializing = false;
    window.parent.postMessage({ type: 'neonfall-ready' }, window.location.origin);
  }, fail);
}());
  </script>
</body>
</html>
